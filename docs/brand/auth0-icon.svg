<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#4B41D4"/>
    </linearGradient>
    <clipPath id="band">
      <rect x="66" y="212" width="380" height="88" rx="44"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#1A1633" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- belt band: rank-colour stripes clipped to a rounded pill -->
    <g clip-path="url(#band)">
      <rect x="66"  y="212" width="112" height="88" fill="#EEF0FA"/> <!-- white -->
      <rect x="178" y="212" width="78"  height="88" fill="#2F6BFF"/> <!-- blue  -->
      <rect x="256" y="212" width="78"  height="88" fill="#8B2FC9"/> <!-- purple -->
      <rect x="334" y="212" width="112" height="88" fill="#7A4A2B"/> <!-- brown -->
    </g>

    <!-- belt tails (behind the knot) -->
    <path d="M232 292 h20 v78 l-10 -12 -10 12 z" fill="#23252E"/>
    <path d="M260 292 h20 v78 l-10 -12 -10 12 z" fill="#23252E"/>

    <!-- knot -->
    <rect x="206" y="206" width="100" height="100" rx="28" fill="#23252E"/>
    <rect x="226" y="226" width="60"  height="60"  rx="16" fill="#33323E"/>
  </g>
</svg>
