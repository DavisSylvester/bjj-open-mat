name: API Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'infra/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  # Duplicated from .github/workflows/ci.yml — GitHub Actions has no
  # cross-workflow `needs`, so the gate must live in this file to block the
  # deploy. Keep the two copies in sync.
  e2e:
    runs-on: ubuntu-latest

    # The gym-search E2E drives the real app against a real MongoDB. A memory
    # server would not exercise the 2dsphere index the search depends on.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Scoped deliberately to the gym-search E2E. The full suite has 5
      # pre-existing failures in device.routes.test.mts (5s timeouts, unrelated
      # to this feature) that would red every build. Widening this to `bun test`
      # is a one-line change once those are fixed.
      - name: Gym search E2E
        working-directory: apps/api
        env:
          # test/setup.mts (preloaded via bunfig.toml) OVERWRITES MONGODB_URI
          # with TEST_MONGODB_URI to keep tests off any ambient cluster. Setting
          # MONGODB_URI here would be inert — this is the variable that lands.
          TEST_MONGODB_URI: mongodb://localhost:27017
        run: bun test test/gym-search.e2e.test.mts

  deploy:
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::318205107378:role/bjj-github-deploy
          aws-region: us-east-1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      # Deploy the OIDC deploy-role stack first so any policy changes (e.g. the
      # secretsmanager grant the sync step below needs) are applied before the
      # role's in-flight session uses them. IAM evaluates the role's current
      # policies at call time, so the update takes effect within this same run.
      # Then build the Lambda container image (Docker on the runner), push to the
      # CDK-managed ECR, and update the Lambda + API Gateway.
      - name: Deploy stacks
        working-directory: infra
        run: npx cdk deploy BjjGithubOidcStack BjjApiStack --require-approval never

      # Keep runtime API keys in the app secret that the Lambda overlays onto
      # process.env at cold start (config/secrets.mts). Sourced from GitHub
      # secrets so they are never committed. Requires secretsmanager
      # Get/PutSecretValue on the bjj-github-deploy role.
      #
      # To add another key: add it to `env:` below and to the jq object. Only
      # keys with a non-empty value are written, so an unconfigured GitHub
      # secret can never blank an existing value in Secrets Manager.
      #
      # Key names are logged; values never are.
      - name: Sync runtime API keys into app secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          PATCH=$(jq -n \
            --arg openai "${OPENAI_API_KEY:-}" \
            --arg places "${GOOGLE_PLACES_API_KEY:-}" \
            '{OPENAI_API_KEY: $openai, GOOGLE_PLACES_API_KEY: $places}
             | with_entries(select(.value != ""))')
          if [ "$(printf '%s' "$PATCH" | jq 'length')" -eq 0 ]; then
            echo "No runtime API keys configured; skipping"
            exit 0
          fi
          echo "Syncing: $(printf '%s' "$PATCH" | jq -r 'keys | join(", ")')"
          CUR=$(aws secretsmanager get-secret-value --secret-id bjj-open-mat/app --region us-east-1 --query SecretString --output text)
          # jq failure (e.g. malformed secret) aborts the step via pipefail rather
          # than writing an empty string over the secret.
          NEW=$(printf '%s' "$CUR" | jq --argjson patch "$PATCH" '. + $patch')
          aws secretsmanager put-secret-value --secret-id bjj-open-mat/app --region us-east-1 --secret-string "$NEW"
          echo "Secret keys after sync: $(printf '%s' "$NEW" | jq -r 'keys | join(", ")')"
